allowBuilds:
  sharp: false
  unrs-resolver: false

# Supply-chain guards. Read SECURITY.md before loosening either one.
# Skip versions published in the last 24 hours; hijacked releases are usually pulled within hours.
minimumReleaseAge: 1440
# Refuse a version published with weaker proof of origin than an earlier one (a common sign of a stolen publish token).
trustPolicy: no-downgrade
# Exact versions checked by hand: old releases on a maintenance line, published before that package started signing releases. Not takeovers.
trustPolicyExclude:
  - semver@6.3.1 # 2023 backport fix, pulled in by @babel/core
  - undici-types@6.21.0 # 2024 release, pulled in by @types/node@22
